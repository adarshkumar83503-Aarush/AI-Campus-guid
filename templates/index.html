<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Campus Guide & Navigator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Routing Machine (Route & Turn-by-Turn Directions) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <style>
    /* Routing instructions box styling */
    .leaflet-routing-container {
      background-color: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-height: 250px;
      overflow-y: auto;
      font-size: 12px;
    }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col md:flex-row overflow-hidden font-sans">

  <!-- Left Sidebar / Chat Assistant -->
  <div class="w-full md:w-1/3 bg-white flex flex-col border-r shadow-lg h-1/2 md:h-full z-10">
    <div class="p-4 bg-blue-600 text-white flex justify-between items-center shadow-sm">
      <div>
        <h1 class="text-lg font-bold">🧭 AI Campus Guide</h1>
        <p class="text-xs text-blue-100">Live Campus Navigator</p>
      </div>
      <span class="text-xs bg-blue-700 px-2.5 py-1 rounded-full font-medium">GPS Active</span>
    </div>

    <!-- Quick Buttons -->
    <div class="p-3 bg-gray-50 border-b flex gap-2 overflow-x-auto text-xs">
      <button onclick="sendQuick('Where is the library?')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1.5 rounded-full whitespace-nowrap transition">📚 Library</button>
      <button onclick="sendQuick('How to reach the computer lab?')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1.5 rounded-full whitespace-nowrap transition">💻 CS Lab</button>
      <button onclick="sendQuick('Where is the canteen?')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1.5 rounded-full whitespace-nowrap transition">🍔 Canteen</button>
      <button onclick="sendQuick('Where is the placement cell?')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1.5 rounded-full whitespace-nowrap transition">🏢 Placement</button>
    </div>

    <!-- Chat Messages -->
    <div id="chatbox" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
      <div class="bg-gray-200 text-gray-800 p-3 rounded-xl max-w-[85%] leading-relaxed">
        Hello! 👋 Main aapka AI Campus Guide hoon. Poochiye kahan jana hai, main live route draw kar dunga!
      </div>
    </div>

    <!-- Input Bar -->
    <div class="p-3 border-t flex gap-2 bg-white">
      <input id="userInput" type="text" placeholder="Ask for route (e.g. library)..." class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Send</button>
    </div>
  </div>

  <!-- Right Side / Map View -->
  <div class="w-full md:w-2/3 h-1/2 md:h-full relative">
    <div id="map" class="w-full h-full"></div>
  </div>

  <script>
    // 1. Initial coordinates (Campus default)
    let userLat = 28.4719;
    let userLng = 77.4900;
    let userMarker = null;
    let routingControl = null;

    const map = L.map('map').setView([userLat, userLng], 17);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 2. Load predefined campus markers
    const locations = {{ locations | tojson }};
    for (let key in locations) {
      const loc = locations[key];
      L.marker([loc.lat, loc.lng]).addTo(map)
        .bindPopup(`<b>${loc.name}</b><br>${loc.desc || ''}`);
    }

    // 3. Detect Real User Live Location
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;

          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.circleMarker([userLat, userLng], {
            radius: 8,
            fillColor: "#2563eb",
            color: "#ffffff",
            weight: 3,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map).bindPopup("📍 <b>Aap Yahan Hain (Start Point)</b>").openPopup();

          map.setView([userLat, userLng], 17);
        },
        (err) => {
          console.warn("Location permission not granted. Using campus gate as default start point.");
          userMarker = L.marker([userLat, userLng]).addTo(map).bindPopup("📍 Campus Main Gate (Default Start)");
        }
      );
    }

    // 4. Draw Route Function
    function drawRouteTo(destLat, destLng) {
      // Remove old route line if exists
      if (routingControl) {
        map.removeControl(routingControl);
      }

      // Add fresh walking route with turn-by-turn steps
      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(userLat, userLng),
          L.latLng(destLat, destLng)
        ],
        routeWhileDragging: false,
        addWaypoints: false,
        lineOptions: {
          styles: [{ color: '#2563eb', weight: 6, opacity: 0.85 }]
        }
      }).addTo(map);
    }

    // 5. Send Message Logic
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMsg(text, 'user');
      input.value = '';

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        appendMsg(data.reply, 'bot');

        // If coordinates found, draw the route line on map
        if (data.lat && data.lng) {
          drawRouteTo(data.lat, data.lng);
        }
      } catch (err) {
        appendMsg('Server se connect hone me issue aa raha hai.', 'bot');
      }
    }

    function sendQuick(query) {
      document.getElementById('userInput').value = query;
      sendMessage();
    }

    function appendMsg(msg, sender) {
      const box = document.getElementById('chatbox');
      const div = document.createElement('div');
      div.className = sender === 'user' 
        ? 'ml-auto bg-blue-600 text-white p-3 rounded-xl max-w-[85%] text-sm'
        : 'bg-gray-200 text-gray-800 p-3 rounded-xl max-w-[85%] text-sm whitespace-pre-line leading-relaxed';
      div.innerText = msg;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
  <!-- Student Login Modal Overlay -->
<div id="loginModal" ...<!-- Student Login Modal Overlay -->
</html>
