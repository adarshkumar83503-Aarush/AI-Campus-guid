<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Campus Guide & Navigator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <style>
    .leaflet-routing-container {
      background-color: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
    }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col md:flex-row overflow-hidden font-sans relative">

  <!-- Student OTP Verification Modal -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4" style="z-index: 99999 !important;">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-center relative" style="z-index: 100000 !important;">
      
      <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-2 text-2xl font-bold">
        🎓
      </div>
      <h2 class="text-xl font-bold text-gray-800">Student Portal Login</h2>
      <p class="text-xs text-gray-500 mt-1">Apna Admission No. daal kar OTP se verify karein.</p>

      <!-- Step 1: Admission Input -->
      <div id="stepAdmission" class="mt-4 text-left">
        <label class="block text-xs font-semibold text-gray-700 mb-1">Admission Number</label>
        <input id="admissionInput" type="text" placeholder="e.g. GLB2023001" value="GLB2023001"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase font-mono" />
        <button onclick="requestOtp()" class="w-full mt-3 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-semibold transition">
          Generate OTP ➔
        </button>
      </div>

      <!-- Step 2: OTP Input Screen -->
      <div id="stepOtp" class="mt-4 text-left hidden">
        <!-- Live OTP Alert Box on Screen -->
        <div class="bg-emerald-50 border border-emerald-300 rounded-lg p-3 text-center mb-3">
          <p class="text-xs text-emerald-800 font-medium">Aapka OTP generate ho chuka hai:</p>
          <p id="generatedOtpDisplay" class="text-2xl font-black text-emerald-600 tracking-widest font-mono mt-1 select-all"></p>
        </div>

        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-semibold text-gray-700">Enter Received OTP</label>
          <button onclick="backToAdmission()" class="text-[11px] text-blue-600 hover:underline">Change ID</button>
        </div>
        <input id="otpInput" type="text" maxlength="6" placeholder="• • • • • •" 
          class="w-full text-center tracking-widest text-lg font-bold border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono" />
        
        <button onclick="submitOtp()" class="w-full mt-3 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg text-sm font-semibold transition">
          Verify & Enter Campus ➔
        </button>
      </div>

      <!-- Error Text -->
      <p id="authError" class="text-xs text-red-500 mt-2 hidden font-medium"></p>
      
      <div class="mt-4 pt-2 border-t text-[11px] text-gray-400">
        Demo ID: <span class="font-mono font-semibold text-gray-600">GLB2023001</span>
      </div>
    </div>
  </div>

  <!-- Left Sidebar -->
  <div class="w-full md:w-1/3 bg-white flex flex-col border-r shadow-lg h-1/2 md:h-full z-10">
    <div class="p-4 bg-blue-600 text-white flex justify-between items-center shadow-sm">
      <div>
        <h1 class="text-lg font-bold">🧭 AI Campus Guide</h1>
        <p id="studentBadge" class="text-xs text-blue-100">Guest Mode</p>
      </div>
      <span class="text-xs bg-blue-700 px-2.5 py-1 rounded-full font-medium">Online</span>
    </div>

    <!-- Chips -->
    <div class="p-3 bg-gray-50 border-b flex gap-2 overflow-x-auto text-xs">
      <button onclick="sendQuick('Where is the library?')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1.5 rounded-full whitespace-nowrap transition">📚 Library</button>
      <button onclick="sendQuick('How to reach the computer lab?')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1.5 rounded-full whitespace-nowrap transition">💻 CS Lab</button>
      <button onclick="sendQuick('Where is the canteen?')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1.5 rounded-full whitespace-nowrap transition">🍔 Canteen</button>
    </div>

    <!-- Chatbox -->
    <div id="chatbox" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
      <div class="bg-gray-200 text-gray-800 p-3 rounded-xl max-w-[85%] leading-relaxed">
        Hello! 👋 Verification ke baad kisi bhi building ka naam search karein, map par live route show hoga.
      </div>
    </div>

    <!-- Input -->
    <div class="p-3 border-t flex gap-2 bg-white">
      <input id="userInput" type="text" placeholder="Search destination (e.g. library)..." class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Send</button>
    </div>
  </div>

  <!-- Right Map View -->
  <div class="w-full md:w-2/3 h-1/2 md:h-full relative">
    <div id="map" class="w-full h-full"></div>
  </div>

  <script>
    let isAuthenticated = false;
    let currentAdmissionNo = "";

    // Step 1: Request OTP
    async function requestOtp() {
      const input = document.getElementById('admissionInput');
      const errBox = document.getElementById('authError');
      currentAdmissionNo = input.value.trim().toUpperCase();

      if (!currentAdmissionNo) {
        errBox.innerText = "Kripya Admission Number darj karein.";
        errBox.classList.remove('hidden');
        return;
      }
      errBox.classList.add('hidden');

      try {
        const res = await fetch('/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admission_no: currentAdmissionNo })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('stepAdmission').classList.add('hidden');
          document.getElementById('stepOtp').classList.remove('hidden');
          // Screen par OTP dikhana
          document.getElementById('generatedOtpDisplay').innerText = data.otp;
          document.getElementById('otpInput').value = data.otp; // Auto-fill for convenience
        } else {
          errBox.innerText = data.message;
          errBox.classList.remove('hidden');
        }
      } catch (e) {
        errBox.innerText = "Backend server connect nahi ho pa raha.";
        errBox.classList.remove('hidden');
      }
    }

    // Step 2: Submit OTP
    async function submitOtp() {
      const otpInput = document.getElementById('otpInput');
      const errBox = document.getElementById('authError');
      const otp = otpInput.value.trim();

      if (!otp) {
        errBox.innerText = "Kripya OTP enter karein.";
        errBox.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch('/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admission_no: currentAdmissionNo, otp: otp })
        });
        const data = await res.json();

        if (data.success) {
          isAuthenticated = true;
          document.getElementById('loginModal').classList.add('hidden');
          document.getElementById('studentBadge').innerText = data.student_name;
          appendMsg(`✅ ${data.message} Aapka Campus Navigator unlock ho gaya hai!`, 'bot');
        } else {
          errBox.innerText = data.message;
          errBox.classList.remove('hidden');
        }
      } catch (e) {
        errBox.innerText = "Verification me issue aaya. Dobara try karein.";
        errBox.classList.remove('hidden');
      }
    }

    function backToAdmission() {
      document.getElementById('stepOtp').classList.add('hidden');
      document.getElementById('stepAdmission').classList.remove('hidden');
      document.getElementById('authError').classList.add('hidden');
    }

    // Map & GPS setup
    let userLat = 28.4728;
    let userLng = 77.4897;
    let realTimeMarker = null;
    let routingControl = null;
    let activeDestination = null;

    const map = L.map('map').setView([userLat, userLng], 17);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const locations = {{ locations | tojson }};
    for (let key in locations) {
      const loc = locations[key];
      L.marker([loc.lat, loc.lng]).addTo(map)
        .bindPopup(`<b>${loc.name}</b><br>${loc.desc || ''}`);
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;

          if (!realTimeMarker) {
            realTimeMarker = L.circleMarker([userLat, userLng], {
              radius: 9,
              fillColor: "#2563eb",
              color: "#ffffff",
              weight: 3,
              fillOpacity: 1
            }).addTo(map).bindPopup("📍 <b>Aap Yahan Hain</b>").openPopup();
          } else {
            realTimeMarker.setLatLng([userLat, userLng]);
          }

          if (isAuthenticated && activeDestination && routingControl) {
            routingControl.setWaypoints([
              L.latLng(userLat, userLng),
              L.latLng(activeDestination.lat, activeDestination.lng)
            ]);
          }
        },
        (err) => console.warn("GPS Warning:", err.message),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    function drawRouteTo(destLat, destLng) {
      if (!isAuthenticated) return;
      activeDestination = { lat: destLat, lng: destLng };

      if (routingControl) map.removeControl(routingControl);

      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(userLat, userLng),
          L.latLng(destLat, destLng)
        ],
        routeWhileDragging: false,
        addWaypoints: false,
        show: true,
        lineOptions: {
          styles: [{ color: '#2563eb', weight: 6, opacity: 0.85 }]
        }
      }).addTo(map);
    }

    async function sendMessage() {
      if (!isAuthenticated) return;
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMsg(text, 'user');
      input.value = '';

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        appendMsg(data.reply, 'bot');

        if (data.lat && data.lng) {
          drawRouteTo(data.lat, data.lng);
        }
      } catch (err) {
        appendMsg('Server connection error.', 'bot');
      }
    }

    function sendQuick(query) {
      document.getElementById('userInput').value = query;
      sendMessage();
    }

    function appendMsg(msg, sender) {
      const box = document.getElementById('chatbox');
      const div = document.createElement('div');
      div.className = sender === 'user' 
        ? 'ml-auto bg-blue-600 text-white p-3 rounded-xl max-w-[85%] text-sm'
        : 'bg-gray-200 text-gray-800 p-3 rounded-xl max-w-[85%] text-sm whitespace-pre-line leading-relaxed';
      div.innerText = msg;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
