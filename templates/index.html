<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GL Bajaj CampusGuide | Modular Super Portal</title>


  <!-- Tailwind & Leaflet -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    #map { height: calc(100vh - 75px); width: 100%; z-index: 10; }
    .leaflet-routing-container { display: none !important; }
    .user-live-pin {
      width: 18px; height: 18px; background: #2563eb; border: 3px solid #fff; border-radius: 50%;
      box-shadow: 0 0 0 rgba(37, 99, 235, 0.7); animation: userPulse 1.8s infinite;
    }
    @keyframes userPulse {
      0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
      70% { box-shadow: 0 0 0 14px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col overflow-x-hidden">

  <!-- NAVBAR -->
  <header class="h-[75px] bg-slate-950/95 backdrop-blur border-b border-slate-800 px-3 sm:px-6 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-extrabold text-white text-base">GL</div>
      <div>
        <h1 class="text-sm sm:text-base font-extrabold text-white">GL Bajaj <span class="text-blue-500">CampusGuide</span></h1>
        <p class="text-[10px] text-slate-400">Modular Super Portal</p>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="hidden md:flex items-center gap-1 bg-slate-900 border border-slate-800 p-1 rounded-xl">
      <button onclick="switchTab('explore')" id="tab-btn-explore" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white">🧭 Explore Map</button>
      <button onclick="switchTab('counselling')" id="tab-btn-counselling" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white">🎓 Predictor</button>
      <button onclick="switchTab('lostfound')" id="tab-btn-lostfound" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white">🔍 Lost & Found</button>
      <button onclick="switchTab('clubs')" id="tab-btn-clubs" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white">🎪 Clubs</button>
    </nav>

    <!-- Header Actions -->
    <div class="flex items-center gap-2">
      <button onclick="openModal('visitorModal')" class="text-xs bg-purple-600 hover:bg-purple-500 text-white font-bold px-3 py-1.5 rounded-xl">🪪 Visitor Entry</button>
      <div id="authSlot">
        <button onclick="openModal('studentModal')" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1.5 rounded-xl">🎓 Student Login</button>
      </div>
      <a href="/admin" class="text-xs bg-rose-600/20 text-rose-300 border border-rose-500/40 px-2.5 py-1.5 rounded-xl font-bold">🔐 Admin</a>
    </div>
  </header>

  <!-- ================= INCLUDED SECTIONS ================= -->
  <main class="flex-1 relative">
    {% include 'components/explore.html' %}
    {% include 'components/predictor.html' %}
    {% include 'components/lost_found.html' %}
    {% include 'components/clubs.html' %}
  </main>

  <!-- Modals -->
  {% include 'components/auth_modals.html' %}

  <!-- ================= SHARED JAVASCRIPT LOGIC ================= -->
  <script>
    const LOCATIONS = {{ locations|tojson }};
    const MAIN_GATE = [28.4738, 77.4882];
    let userCurrentCoords = null;
    let userMarker = null;
    let routingControl = null;
    let activeDestData = null;
    let activeUser = null;

    // 1. Tab Switcher
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab-' + tabId).classList.remove('hidden');

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById('tab-btn-' + tabId);
      if(activeBtn) {
        activeBtn.classList.add('bg-blue-600', 'text-white');
        activeBtn.classList.remove('text-slate-400');
      }

      if (tabId === 'explore') {
        setTimeout(() => map.invalidateSize(), 200);
      }
    }

    // 2. Leaflet Map Init
    const map = L.map('map').setView([28.4728, 77.4897], 18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    L.marker(MAIN_GATE).addTo(map).bindPopup("<b>📍 Gate 1 (Main Entrance)</b>");

    // 3. User Geolocation
    function requestUserLocation(manual = false) {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          userCurrentCoords = [lat, lng];

          const badge = document.getElementById('originStatusBadge');
          if(badge) {
            badge.innerText = "From: Your Live Location 📍";
            badge.className = "text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-semibold";
          }

          const userIcon = L.divIcon({ className: 'user-live-pin', iconSize: [18, 18], iconAnchor: [9, 9] });
          if (!userMarker) {
            userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map).bindPopup("<b>You are here!</b>");
          } else {
            userMarker.setLatLng([lat, lng]);
          }
          map.flyTo([lat, lng], 19, { animate: true });

          if (activeDestData) {
            drawRealRoadRoute(activeDestData.lat, activeDestData.lng, activeDestData.name, activeDestData.desc);
          }
        },
        (err) => { if (manual) alert("Location permission allow karein."); },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }
    window.addEventListener('load', () => requestUserLocation(false));

    // 4. Real OSRM Road Router
    function drawRealRoadRoute(destLat, destLng, name, desc) {
      activeDestData = { lat: destLat, lng: destLng, name: name, desc: desc };
      if (routingControl) map.removeControl(routingControl);

      const startCoord = userCurrentCoords ? L.latLng(userCurrentCoords[0], userCurrentCoords[1]) : L.latLng(MAIN_GATE[0], MAIN_GATE[1]);
      const endCoord = L.latLng(destLat, destLng);

      routingControl = L.Routing.control({
        waypoints: [startCoord, endCoord],
        router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1', profile: 'foot' }),
        lineOptions: { styles: [{ color: '#2563eb', opacity: 0.85, weight: 6 }] },
        addWaypoints: false, draggableWaypoints: false, fitSelectedRoutes: true, show: false
      }).addTo(map);

      routingControl.on('routesfound', function(e) {
        const routes = e.routes;
        const summary = routes[0].summary;
        const totalDist = Math.round(summary.totalDistance);
        const walkingTime = Math.max(1, Math.round(summary.totalTime / 60));

        document.getElementById('routeDetailsCard').classList.remove('hidden');
        document.getElementById('destTitle').innerText = name;
        document.getElementById('distVal').innerText = totalDist >= 1000 ? `${(totalDist/1000).toFixed(2)} km` : `${totalDist} m`;
        document.getElementById('timeVal').innerText = `~${walkingTime} mins walk`;

        const guideBox = document.getElementById('guideText');
        guideBox.innerHTML = '';
        routes[0].instructions.forEach((step, idx) => {
          const div = document.createElement('div');
          div.className = "py-0.5 border-b border-slate-800 last:border-none";
          div.innerHTML = `<span class="text-blue-400 font-bold">${idx + 1}.</span> ${step.text} (${Math.round(step.distance)}m)`;
          guideBox.appendChild(div);
        });
      });
    }

    function closeRouteCard() {
      document.getElementById('routeDetailsCard').classList.add('hidden');
      if (routingControl) map.removeControl(routingControl);
    }

    // Populate Navigation Chips
    const chips = document.getElementById('navChips');
    for (let k in LOCATIONS) {
      let l = LOCATIONS[k];
      let m = L.marker([l.lat, l.lng]).addTo(map).bindPopup(`<b>${l.name}</b>`);
      m.on('click', () => drawRealRoadRoute(l.lat, l.lng, l.name, l.desc));

      let b = document.createElement('button');
      b.className = "text-xs bg-slate-900 border border-slate-700 px-2 py-1 rounded-xl text-slate-200";
      b.innerText = l.name.split('(')[0];
      b.onclick = () => drawRealRoadRoute(l.lat, l.lng, l.name, l.desc);
      chips.appendChild(b);
    }

    // Modal Helpers
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // Admission Predictor Handler
    async function runAdmissionPredictor() {
      const rank = document.getElementById('predRank').value;
      const cat = document.getElementById('predCat').value;
      if (!rank) return alert("Rank daalna zaroori hai");

      const res = await fetch('/api/predict-admission', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ rank: rank, category: cat })
      });
      const data = await res.json();
      if(data.success) {
        document.getElementById('predictorResult').classList.remove('hidden');
        document.getElementById('predSummary').innerText = data.summary;
        const cards = document.getElementById('predCards');
        cards.innerHTML = '';
        data.eligible_branches.forEach(b => {
          cards.innerHTML += `<div class="bg-slate-900 border border-slate-800 p-3 rounded-xl"><span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full font-bold">${b.chance}</span><h5 class="text-xs font-bold text-white mt-1">${b.branch}</h5></div>`;
        });
      }
    }

    // Auth Calls
    let tempAdm = "", tempMob = "";
    async function requestStudentOtp() {
      const adm = document.getElementById('stdAdm').value.trim().toUpperCase();
      if (!adm) return;
      const res = await fetch('/student/send-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ admission_no: adm }) });
      const d = await res.json();
      if (d.success) {
        tempAdm = adm;
        document.getElementById('stdStep1').classList.add('hidden');
        document.getElementById('stdStep2').classList.remove('hidden');
        document.getElementById('stdOtpMsg').innerText = d.message;
        document.getElementById('stdOtp').value = d.otp;
      } else alert(d.message);
    }

    async function verifyStudentOtp() {
      const otp = document.getElementById('stdOtp').value.trim();
      const res = await fetch('/student/verify-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ admission_no: tempAdm, otp: otp }) });
      const d = await res.json();
      if (d.success) {
        closeModal('studentModal');
        document.getElementById('authSlot').innerHTML = `<span class="text-xs bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-xl text-emerald-400 font-bold">🎓 ${d.user.name}</span>`;
      } else alert(d.message);
    }

    async function requestVisitorOtp() {
      const name = document.getElementById('visName').value.trim();
      const mobile = document.getElementById('visMobile').value.trim();
      const aadhaar = document.getElementById('visAadhaar').value.trim();
      const purpose = document.getElementById('visPurpose').value;
      if (!name || !mobile || !aadhaar) return alert("Pura form bharein.");

      const res = await fetch('/visitor/send-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, mobile, aadhaar, purpose }) });
      const d = await res.json();
      if (d.success) {
        tempMob = mobile;
        document.getElementById('visStep1').classList.add('hidden');
        document.getElementById('visStep2').classList.remove('hidden');
        document.getElementById('visOtpNotice').innerText = d.message;
        document.getElementById('visOtp').value = d.otp;
      } else alert(d.message);
    }

    async function verifyVisitorOtp() {
      const otp = document.getElementById('visOtp').value.trim();
      const res = await fetch('/visitor/verify-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ mobile: tempMob, otp: otp }) });
      const d = await res.json();
      if (d.success) {
        closeModal('visitorModal');
        alert(`Pass Generated: ${d.visitor.pass_id}`);
        document.getElementById('authSlot').innerHTML = `<span class="text-xs bg-purple-950 border border-purple-500/40 px-3 py-1.5 rounded-xl text-purple-300 font-bold">🪪 Pass: ${d.visitor.pass_id}</span>`;
      } else alert(d.message);
    }
  </script>
</body>
</html>
