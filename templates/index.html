<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GL Bajaj CampusGuide | 360° Smart Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    #map { height: calc(100vh - 75px); width: 100%; z-index: 10; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- NAVBAR -->
  <header class="h-[75px] bg-slate-950/95 backdrop-blur border-b border-slate-800 px-3 sm:px-6 flex items-center justify-between z-30">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-extrabold text-white text-base">
        GL
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-extrabold text-white">GL Bajaj <span class="text-blue-500">CampusGuide</span></h1>
        <p class="text-[10px] text-slate-400">Smart Navigation & Security Portal</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="requestUserLocation(true)" class="text-xs bg-slate-900 border border-slate-700 px-2.5 py-1.5 rounded-xl text-slate-200">
        <span id="gpsPinIcon">📍</span> <span id="gpsPinStatus">GPS</span>
      </button>
      <button onclick="openModal('complaintModal')" class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1.5 rounded-xl font-semibold">
        ⚠️ Report
      </button>
      <button onclick="openModal('visitorModal')" class="text-xs bg-purple-600 hover:bg-purple-500 text-white font-bold px-3 py-1.5 rounded-xl shadow-md">
        🪪 Visitor Entry
      </button>
      <div id="authSlot">
        <button onclick="openModal('studentModal')" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1.5 rounded-xl shadow-md">
          🎓 Student Login
        </button>
      </div>
      <a href="/admin" class="text-xs bg-rose-600/20 text-rose-300 border border-rose-500/40 px-2.5 py-1.5 rounded-xl font-bold">
        🔐 Admin
      </a>
    </div>
  </header>

  <!-- MAP -->
  <div class="flex-1 relative flex">
    <div id="map"></div>
    <div class="absolute top-4 left-4 z-[400] max-w-xs w-full bg-slate-950/90 p-3 rounded-2xl border border-slate-800 shadow-2xl space-y-2 pointer-events-auto">
      <div class="flex justify-between items-center">
        <span class="text-[11px] font-bold text-slate-400 uppercase">Quick Navigation</span>
        <span id="originStatusBadge" class="text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-full font-semibold">Gate 1</span>
      </div>
      <div class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto" id="navChips"></div>
    </div>

    <!-- Active Route Card -->
    <div id="routeDetailsCard" class="absolute bottom-6 left-4 right-4 sm:left-auto sm:right-6 sm:w-96 z-[400] bg-slate-900/95 border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-3 hidden pointer-events-auto">
      <div class="flex justify-between items-start">
        <h4 id="destTitle" class="text-base font-extrabold text-white">Destination</h4>
        <button onclick="closeRouteCard()" class="text-slate-400 hover:text-white text-sm">✕</button>
      </div>
      <div class="grid grid-cols-2 gap-2 bg-slate-950/60 p-2.5 rounded-2xl border border-slate-800">
        <div><div class="text-[10px] text-slate-400">Total Distance</div><div id="distVal" class="text-sm font-bold text-emerald-400 font-mono">-- m</div></div>
        <div><div class="text-[10px] text-slate-400">Estimated Walk</div><div id="timeVal" class="text-sm font-bold text-blue-400 font-mono">-- mins</div></div>
      </div>
      <p id="guideText" class="text-xs text-slate-400 bg-slate-800/50 p-3 rounded-xl border border-slate-700/50"></p>
    </div>
  </div>

  <!-- 🎓 STUDENT MODAL -->
  <div id="studentModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-white">Student Portal Login</h3>
        <button onclick="closeModal('studentModal')" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div id="stdStep1" class="space-y-3">
        <input id="stdAdm" type="text" placeholder="Admission ID (e.g. 25116CN001)" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm font-mono uppercase text-white outline-none">
        <button onclick="requestStudentOtp()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold p-2.5 rounded-xl text-sm">Send Email OTP</button>
      </div>
      <div id="stdStep2" class="space-y-3 hidden">
        <div id="stdOtpMsg" class="text-xs bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-emerald-300 font-mono text-center"></div>
        <input id="stdOtp" type="text" placeholder="• • • • • •" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-center text-lg font-mono text-white outline-none">
        <button onclick="verifyStudentOtp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-2.5 rounded-xl text-sm">Verify & Login</button>
      </div>
      <p id="stdErr" class="text-xs text-red-400 text-center hidden"></p>
    </div>
  </div>

  <!-- 🪪 VISITOR MODAL -->
  <div id="visitorModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-md w-full space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-white">Visitor Registration & Gate Pass</h3>
        <button onclick="closeModal('visitorModal')" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div id="visStep1" class="space-y-3">
        <input id="visName" type="text" placeholder="Full Name" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm text-white outline-none">
        <div class="grid grid-cols-2 gap-2">
          <input id="visMobile" type="tel" maxlength="10" placeholder="Mobile Number" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm text-white outline-none font-mono">
          <input id="visAadhaar" type="text" maxlength="12" placeholder="Govt ID No." class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm text-white outline-none font-mono">
        </div>
        <select id="visPurpose" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm text-white outline-none">
          <option value="Admission Enquiry">Admission Enquiry</option>
          <option value="Parent Visit">Parent Visit</option>
          <option value="Campus Fest">Campus Fest / Event</option>
          <option value="Other">Other</option>
        </select>
        <button onclick="requestVisitorOtp()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold p-3 rounded-xl text-sm">Generate Verification OTP</button>
      </div>
      <div id="visStep2" class="space-y-3 hidden">
        <div id="visOtpNotice" class="text-xs bg-purple-950/60 border border-purple-500/40 p-2.5 rounded-xl text-purple-300 font-mono text-center"></div>
        <input id="visOtp" type="text" placeholder="• • • • • •" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-center text-lg font-mono text-white outline-none">
        <button onclick="verifyVisitorOtp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-3 rounded-xl text-sm">Confirm Entry & Generate Pass</button>
      </div>
      <p id="visErr" class="text-xs text-red-400 text-center hidden"></p>
    </div>
  </div>

  <!-- ⚠️ COMPLAINT MODAL -->
  <div id="complaintModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-md w-full space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-white">Campus Grievance</h3>
        <button onclick="closeModal('complaintModal')" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <input id="cmpLoc" type="text" placeholder="Location / Lab" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-xl text-sm text-white outline-none">
      <textarea id="cmpDesc" rows="3" placeholder="Samasya ka vivaran..." class="w-full bg-slate-800 border border-slate-700 p-2 rounded-xl text-sm text-white outline-none"></textarea>
      <p id="cmpStatus" class="text-xs font-bold hidden"></p>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeModal('complaintModal')" class="px-3 py-1.5 border border-slate-700 rounded-xl text-xs text-slate-400">Cancel</button>
        <button onclick="submitGrievance()" class="px-4 py-1.5 bg-blue-600 text-xs font-bold text-white rounded-xl">Submit</button>
      </div>
    </div>
  </div>

  <script>
    const LOCATIONS = {{ locations|tojson }};
    const MAIN_GATE = [28.4738, 77.4882];
    let userCurrentCoords = null;
    let routePolyline = null;
    let activeUser = null;

    const map = L.map('map').setView([28.4728, 77.4897], 18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    L.marker(MAIN_GATE).addTo(map).bindPopup("<b>📍 Gate 1 (Main Entrance)</b>");

    function requestUserLocation(manual = false) {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userCurrentCoords = [pos.coords.latitude, pos.coords.longitude];
          document.getElementById('gpsPinIcon').innerText = "🟢";
          document.getElementById('gpsPinStatus').innerText = "Active";
          document.getElementById('originStatusBadge').innerText = "My Location 📍";
          L.marker(userCurrentCoords).addTo(map).bindPopup("<b>You are here!</b>");
          map.flyTo(userCurrentCoords, 19);
        },
        (err) => { if(manual) alert("Please allow location access in browser."); }
      );
    }
    window.addEventListener('load', () => requestUserLocation(false));

    function calculateDistance(c1, c2) {
      const R = 6371e3;
      const dLat = (c2[0] - c1[0]) * Math.PI / 180;
      const dLon = (c2[1] - c1[1]) * Math.PI / 180;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(c1[0]*Math.PI/180)*Math.cos(c2[0]*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function navigateTo(lat, lng, name, desc) {
      if (routePolyline) map.removeLayer(routePolyline);
      const start = userCurrentCoords || MAIN_GATE;
      const mid = [(start[0] + lat) / 2, (start[1] + lng) / 2];
      routePolyline = L.polyline([start, mid, [lat, lng]], { color: '#2563eb', weight: 6, dashArray: '8, 8' }).addTo(map);
      map.fitBounds(routePolyline.getBounds(), { padding: [60, 60] });

      const dist = calculateDistance(start, [lat, lng]);
      document.getElementById('routeDetailsCard').classList.remove('hidden');
      document.getElementById('destTitle').innerText = name;
      document.getElementById('distVal').innerText = dist + " m";
      document.getElementById('timeVal').innerText = Math.max(1, Math.round(dist/75)) + " mins";
      document.getElementById('guideText').innerText = `Follow path from ${userCurrentCoords ? 'Your GPS' : 'Gate 1'} towards ${name}.`;
    }

    function closeRouteCard() { document.getElementById('routeDetailsCard').classList.add('hidden'); }

    const chips = document.getElementById('navChips');
    for (let k in LOCATIONS) {
      let l = LOCATIONS[k];
      let m = L.marker([l.lat, l.lng]).addTo(map).bindPopup(`<b>${l.name}</b>`);
      m.on('click', () => navigateTo(l.lat, l.lng, l.name, l.desc));
      let b = document.createElement('button');
      b.className = "text-xs bg-slate-900 border border-slate-700 px-2 py-1 rounded-lg text-slate-200";
      b.innerText = l.name.split('(')[0];
      b.onclick = () => navigateTo(l.lat, l.lng, l.name, l.desc);
      chips.appendChild(b);
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // Student Auth
    let tempAdm = "";
    async function requestStudentOtp() {
      const adm = document.getElementById('stdAdm').value.trim().toUpperCase();
      if(!adm) return;
      const res = await fetch('/student/send-otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ admission_no: adm })
      });
      const data = await res.json();
      if(data.success) {
        tempAdm = adm;
        document.getElementById('stdStep1').classList.add('hidden');
        document.getElementById('stdStep2').classList.remove('hidden');
        document.getElementById('stdOtpMsg').innerText = data.message;
        // Auto-fill OTP for seamless verification
        document.getElementById('stdOtp').value = data.otp;
      } else alert(data.message);
    }

    async function verifyStudentOtp() {
      const otp = document.getElementById('stdOtp').value.trim();
      const res = await fetch('/student/verify-otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ admission_no: tempAdm, otp: otp })
      });
      const data = await res.json();
      if(data.success) {
        activeUser = data.user.name;
        closeModal('studentModal');
        document.getElementById('authSlot').innerHTML = `<span class="text-xs bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-xl text-emerald-400 font-bold">🎓 ${data.user.name}</span>`;
      } else alert(data.message);
    }

    // Visitor Auth
    let tempMob = "";
    async function requestVisitorOtp() {
      const name = document.getElementById('visName').value.trim();
      const mobile = document.getElementById('visMobile').value.trim();
      const aadhaar = document.getElementById('visAadhaar').value.trim();
      const purpose = document.getElementById('visPurpose').value;
      if(!name || !mobile || !aadhaar) return alert("Pura form bharein.");

      const res = await fetch('/visitor/send-otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name, mobile, aadhaar, purpose })
      });
      const data = await res.json();
      if(data.success) {
        tempMob = mobile;
        document.getElementById('visStep1').classList.add('hidden');
        document.getElementById('visStep2').classList.remove('hidden');
        document.getElementById('visOtpNotice').innerText = data.message;
        // Auto-fill Visitor OTP
        document.getElementById('visOtp').value = data.otp;
      } else alert(data.message);
    }

    async function verifyVisitorOtp() {
      const otp = document.getElementById('visOtp').value.trim();
      const res = await fetch('/visitor/verify-otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ mobile: tempMob, otp: otp })
      });
      const data = await res.json();
      if(data.success) {
        closeModal('visitorModal');
        alert(`Pass Generated: ${data.visitor.pass_id}`);
        document.getElementById('authSlot').innerHTML = `<span class="text-xs bg-purple-950 border border-purple-500/40 px-3 py-1.5 rounded-xl text-purple-300 font-bold">🪪 Pass: ${data.visitor.pass_id}</span>`;
      } else alert(data.message);
    }

    async function submitGrievance() {
      const desc = document.getElementById('cmpDesc').value.trim();
      const loc = document.getElementById('cmpLoc').value.trim();
      if(!desc) return alert("Vivaran bharein.");
      const res = await fetch('/submit-complaint', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ description: desc, location: loc, admission_no: activeUser || "Guest" })
      });
      const data = await res.json();
      alert(data.message);
      closeModal('complaintModal');
    }
  </script>
</body>
</html>
