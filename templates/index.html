<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GL Bajaj Campus Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: calc(100vh - 65px); width: 100%; }
  </style>
</head>
<body class="bg-slate-900 text-white flex flex-col h-screen overflow-hidden">

  <!-- Header -->
  <header class="h-[65px] bg-slate-900 border-b border-slate-800 px-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="bg-blue-600 text-white font-bold px-2.5 py-1 rounded-lg">GLB</span>
      <h1 class="text-base font-bold">Campus Guide & Navigator</h1>
    </div>
    <div class="flex gap-2">
      <button onclick="document.getElementById('cmpModal').classList.remove('hidden')" class="bg-amber-600 text-xs px-3 py-1.5 rounded-lg font-semibold">Report Issue</button>
      <a href="/admin" class="bg-slate-800 border border-slate-700 text-xs px-3 py-1.5 rounded-lg">Admin</a>
      <button onclick="document.getElementById('loginModal').classList.remove('hidden')" id="loginBtn" class="bg-blue-600 text-xs px-3 py-1.5 rounded-lg font-semibold">Login</button>
    </div>
  </header>

  <!-- Map Area -->
  <div class="flex-1 relative">
    <div id="map"></div>
    <!-- Quick Nav -->
    <div class="absolute top-3 left-3 z-[400] bg-slate-900/90 p-3 rounded-xl border border-slate-700 max-w-xs space-y-1.5">
      <div class="text-[11px] font-bold text-slate-400">QUICK DESTINATIONS</div>
      <div id="buttonsList" class="flex flex-wrap gap-1"></div>
    </div>
  </div>

  <!-- Login Modal -->
  <div id="loginModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 p-5 rounded-xl max-w-xs w-full text-center space-y-3">
      <h3 class="font-bold text-base">Student Portal</h3>
      <input id="admNo" type="text" placeholder="25116CN001" class="w-full bg-slate-900 border border-slate-700 p-2 text-sm rounded outline-none uppercase font-mono">
      <button onclick="getOtp()" class="w-full bg-blue-600 p-2 text-sm rounded font-bold">Send OTP</button>
      
      <div id="otpBox" class="hidden space-y-2 pt-2 border-t border-slate-700">
        <p id="otpMsg" class="text-xs text-amber-300"></p>
        <input id="userOtp" type="text" placeholder="OTP" class="w-full bg-slate-900 border border-slate-700 p-2 text-center text-sm rounded font-mono">
        <button onclick="doLogin()" class="w-full bg-emerald-600 p-2 text-sm rounded font-bold">Verify</button>
      </div>
      <button onclick="document.getElementById('loginModal').classList.add('hidden')" class="text-xs text-slate-400">Cancel</button>
    </div>
  </div>

  <!-- Complaint Modal -->
  <div id="cmpModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 p-5 rounded-xl max-w-sm w-full space-y-3">
      <h3 class="font-bold text-base">Report Campus Issue</h3>
      <input id="cmpLoc" type="text" placeholder="Location / Lab" class="w-full bg-slate-900 border border-slate-700 p-2 text-sm rounded outline-none">
      <textarea id="cmpText" placeholder="Samasya likhein..." class="w-full bg-slate-900 border border-slate-700 p-2 text-sm rounded outline-none"></textarea>
      <button onclick="sendComplaint()" class="w-full bg-amber-600 p-2 text-sm rounded font-bold">Submit</button>
      <button onclick="document.getElementById('cmpModal').classList.add('hidden')" class="w-full text-xs text-slate-400">Close</button>
    </div>
  </div>

  <script>
    const LOCATIONS = {{ locations|tojson }};
    const GATE = [28.4738, 77.4882];
    let routeLine = null;

    const map = L.map('map').setView([28.4728, 77.4897], 18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    L.marker(GATE).addTo(map).bindPopup("<b>Campus Main Gate</b>");

    function goTo(lat, lng, name, desc) {
      if(routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline([GATE, [(GATE[0]+lat)/2, (GATE[1]+lng)/2], [lat, lng]], {
        color: '#3b82f6', weight: 5, dashArray: '6, 6'
      }).addTo(map);
      map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
      L.popup().setLatLng([lat, lng]).setContent(`<b>${name}</b><br><small>${desc}</small>`).openOn(map);
    }

    const bBox = document.getElementById('buttonsList');
    for(let k in LOCATIONS) {
      let l = LOCATIONS[k];
      let m = L.marker([l.lat, l.lng]).addTo(map);
      m.bindPopup(`<b>${l.name}</b>`);
      m.on('click', () => goTo(l.lat, l.lng, l.name, l.desc));

      let btn = document.createElement('button');
      btn.className = "text-[11px] bg-slate-800 border border-slate-600 px-2 py-1 rounded";
      btn.innerText = l.name.split('(')[0];
      btn.onclick = () => goTo(l.lat, l.lng, l.name, l.desc);
      bBox.appendChild(btn);
    }

    let savedAdm = "";
    async function getOtp() {
      savedAdm = document.getElementById('admNo').value.trim().toUpperCase();
      let res = await fetch('/send-otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ admission_no: savedAdm })
      });
      let d = await res.json();
      if(d.success) {
        document.getElementById('otpBox').classList.remove('hidden');
        document.getElementById('otpMsg').innerText = d.message;
        document.getElementById('userOtp').value = d.fallback_otp || '';
      } else alert(d.message);
    }

    async function doLogin() {
      let otp = document.getElementById('userOtp').value.trim();
      let res = await fetch('/verify-otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ admission_no: savedAdm, otp: otp })
      });
      let d = await res.json();
      if(d.success) {
        document.getElementById('loginModal').classList.add('hidden');
        document.getElementById('loginBtn').innerText = d.user.name;
        document.getElementById('loginBtn').className = "bg-emerald-600 text-xs px-3 py-1.5 rounded-lg";
      } else alert(d.message);
    }

    async function sendComplaint() {
      let desc = document.getElementById('cmpText').value.trim();
      let loc = document.getElementById('cmpLoc').value.trim();
      if(!desc) return alert("Vivaran likhein");
      let res = await fetch('/submit-complaint', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ description: desc, location: loc, admission_no: savedAdm || "Guest" })
      });
      let d = await res.json();
      alert(d.message);
      document.getElementById('cmpModal').classList.add('hidden');
    }
  </script>
</body>
</html>
