<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GL Bajaj CampusGuide | 360° Smart Portal</title>

  <!-- Tailwind CSS & Leaflet -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    #map { height: calc(100vh - 75px); width: 100%; z-index: 10; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- ================= TOP NAVBAR ================= -->
  <header class="h-[75px] bg-slate-950/95 backdrop-blur border-b border-slate-800 px-3 sm:px-6 flex items-center justify-between z-30">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-extrabold text-white text-base shadow-lg shadow-blue-500/20">
        GL
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-extrabold text-white leading-tight">
          GL Bajaj <span class="text-blue-500">CampusGuide</span>
        </h1>
        <p class="text-[10px] text-slate-400">Smart Navigation & Security Portal</p>
      </div>
    </div>

    <!-- Actions Bar -->
    <div class="flex items-center gap-2">
      <!-- Grievance Button -->
      <button onclick="openModal('complaintModal')" class="text-xs bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 px-2.5 py-1.5 rounded-xl font-semibold transition flex items-center gap-1">
        <span>⚠️</span>
        <span class="hidden sm:inline">Report Issue</span>
      </button>

      <!-- Visitor Gate Pass Button -->
      <button onclick="openModal('visitorModal')" class="text-xs bg-purple-600 hover:bg-purple-500 text-white font-bold px-3 py-1.5 rounded-xl transition shadow-md shadow-purple-600/20 flex items-center gap-1.5">
        <span>🪪</span>
        <span>Visitor Entry</span>
      </button>

      <!-- Student Login Button -->
      <div id="authSlot">
        <button onclick="openModal('studentModal')" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1.5 rounded-xl transition shadow-md shadow-blue-600/20 flex items-center gap-1.5">
          <span>🎓</span>
          <span>Student Login</span>
        </button>
      </div>

      <!-- Admin Portal Link -->
      <a href="/admin" class="text-xs bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/40 px-2.5 py-1.5 rounded-xl font-bold transition flex items-center gap-1">
        <span>🔐</span>
        <span>Admin Team</span>
      </a>
    </div>
  </header>

  <!-- ================= MAP & QUICK NAV ================= -->
  <div class="flex-1 relative flex">
    <div id="map"></div>

    <div class="absolute top-4 left-4 z-[400] max-w-xs sm:max-w-sm w-full bg-slate-950/90 backdrop-blur-md p-3.5 rounded-2xl border border-slate-800 shadow-2xl space-y-2 pointer-events-auto">
      <div class="flex justify-between items-center">
        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Quick Campus Navigation</span>
        <span class="text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-full font-semibold">Origin: Gate 1</span>
      </div>
      <div class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto" id="navChips"></div>
    </div>
  </div>

  <!-- ================= 🎓 1. STUDENT LOGIN MODAL ================= -->
  <div id="studentModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <h3 class="font-bold text-base text-white">Student Portal Login</h3>
          <p class="text-xs text-slate-400">Registered email OTP se login karein</p>
        </div>
        <button onclick="closeModal('studentModal')" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <div id="stdStep1" class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Admission Number</label>
          <input id="stdAdm" type="text" placeholder="e.g. 25116CN001" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm font-mono uppercase text-white outline-none">
        </div>
        <button onclick="requestStudentOtp()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold p-2.5 rounded-xl text-sm transition">
          Send Email OTP
        </button>
      </div>

      <div id="stdStep2" class="space-y-3 hidden">
        <div id="stdOtpMsg" class="text-xs bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-emerald-300 font-mono text-center"></div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Enter 6-Digit OTP</label>
          <input id="stdOtp" type="text" placeholder="• • • • • •" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-center text-lg font-mono text-white outline-none">
        </div>
        <button onclick="verifyStudentOtp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-2.5 rounded-xl text-sm transition">
          Verify & Access
        </button>
      </div>

      <p id="stdErr" class="text-xs text-red-400 text-center hidden"></p>
    </div>
  </div>

  <!-- ================= 🪪 2. VISITOR GATE PASS MODAL ================= -->
  <div id="visitorModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-md w-full space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <div>
          <h3 class="font-bold text-base text-white flex items-center gap-1.5">
            <span>🪪</span> Visitor Registration & Gate Pass
          </h3>
          <p class="text-xs text-slate-400">Campus entry pass aur automatic logging</p>
        </div>
        <button onclick="closeModal('visitorModal')" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <div id="visStep1" class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Full Name (Pura Naam)</label>
          <input id="visName" type="text" placeholder="e.g. Rahul Sharma" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm text-white outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Mobile Number</label>
            <input id="visMobile" type="tel" maxlength="10" placeholder="10-digit number" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm text-white outline-none font-mono">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Aadhaar Card No.</label>
            <input id="visAadhaar" type="text" maxlength="12" placeholder="12-digit number" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm text-white outline-none font-mono">
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Purpose of Visit (Kyon visit kiya?)</label>
          <select id="visPurpose" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm text-white outline-none">
            <option value="Admission Enquiry / Counselling">Admission Enquiry / Counselling</option>
            <option value="Parent Teacher Meeting / Visit">Parent / Guardian Visit</option>
            <option value="Guest Lecture / Placement / Company">Guest / Company Placement</option>
            <option value="Campus Fest / Event Guest">Campus Fest / Event Attendee</option>
            <option value="Vendor / Delivery / Other">Vendor / Delivery / Maintenance</option>
          </select>
        </div>

        <button onclick="requestVisitorOtp()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold p-3 rounded-xl text-sm transition">
          Generate Verification OTP
        </button>
      </div>

      <div id="visStep2" class="space-y-3 hidden">
        <div id="visOtpNotice" class="text-xs bg-purple-950/60 border border-purple-500/40 p-2.5 rounded-xl text-purple-300 font-mono text-center"></div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Enter Verification OTP</label>
          <input id="visOtp" type="text" placeholder="• • • • • •" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-center text-lg font-mono text-white outline-none">
        </div>
        <button onclick="verifyVisitorOtp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-3 rounded-xl text-sm transition">
          Confirm Entry & Generate Pass
        </button>
      </div>

      <p id="visErr" class="text-xs text-red-400 text-center hidden"></p>
    </div>
  </div>

  <!-- ================= ⚠️ 3. COMPLAINT MODAL ================= -->
  <div id="complaintModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-md w-full space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h3 class="font-bold text-base text-white">Campus Grievance Redressal</h3>
        <button onclick="closeModal('complaintModal')" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Category</label>
        <select id="cmpCat" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-xl text-sm text-white outline-none">
          <option value="Campus Facilities">Campus Facilities (Water / AC / Electricity)</option>
          <option value="Lab & Hardware">Lab / Broken Computers / Internet</option>
          <option value="Cleanliness">Cleanliness & Hygiene</option>
          <option value="Navigation Route">Map Route Bug</option>
        </select>
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Location / Classroom</label>
        <input id="cmpLoc" type="text" placeholder="e.g. AB-2, 2nd Floor, Room 204" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-xl text-sm text-white outline-none">
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Problem Description</label>
        <textarea id="cmpDesc" rows="3" placeholder="Samasya ka vivaran..." class="w-full bg-slate-800 border border-slate-700 p-2 rounded-xl text-sm text-white outline-none"></textarea>
      </div>

      <p id="cmpStatus" class="text-xs font-bold hidden"></p>

      <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
        <button onclick="closeModal('complaintModal')" class="px-3 py-1.5 border border-slate-700 rounded-xl text-xs text-slate-400">Cancel</button>
        <button onclick="submitGrievance()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded-xl text-xs font-bold text-white">Submit Ticket</button>
      </div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    const LOCATIONS = {{ locations|tojson }};
    const MAIN_GATE = [28.4738, 77.4882];
    let routeLine = null;
    let activeUser = null;

    // 1. Map Init
    const map = L.map('map').setView([28.4728, 77.4897], 18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    L.marker(MAIN_GATE).addTo(map).bindPopup("<b>📍 Gate 1 (Campus Main Entrance)</b>");

    function navigateTo(lat, lng, name, desc) {
      if (routeLine) map.removeLayer(routeLine);
      const mid = [(MAIN_GATE[0] + lat) / 2, (MAIN_GATE[1] + lng) / 2];
      routeLine = L.polyline([MAIN_GATE, mid, [lat, lng]], {
        color: '#2563eb', weight: 6, dashArray: '8, 8', opacity: 0.95
      }).addTo(map);

      map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
      L.popup().setLatLng([lat, lng]).setContent(`<b>${name}</b><br><small style="color:#64748b;">${desc}</small>`).openOn(map);
    }

    const chips = document.getElementById('navChips');
    for (let k in LOCATIONS) {
      let loc = LOCATIONS[k];
      let m = L.marker([loc.lat, loc.lng]).addTo(map);
      m.bindPopup(`<b>${loc.name}</b><br><small>${loc.desc}</small>`);
      m.on('click', () => navigateTo(loc.lat, loc.lng, loc.name, loc.desc));

      let b = document.createElement('button');
      b.className = "text-xs bg-slate-900 hover:bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-xl text-slate-200 transition";
      b.innerText = loc.name.split('(')[0].trim();
      b.onclick = () => navigateTo(loc.lat, loc.lng, loc.name, loc.desc);
      chips.appendChild(b);
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // 2. Student Auth
    let tempStudentAdm = "";
    async function requestStudentOtp() {
      const adm = document.getElementById('stdAdm').value.trim().toUpperCase();
      const err = document.getElementById('stdErr');
      err.classList.add('hidden');

      if (!adm) {
        err.innerText = "Admission number daalein.";
        err.classList.remove('hidden');
        return;
      }

      const res = await fetch('/student/send-otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ admission_no: adm })
      });
      const data = await res.json();
      if(data.success) {
        tempStudentAdm = adm;
        document.getElementById('stdStep1').classList.add('hidden');
        document.getElementById('stdStep2').classList.remove('hidden');
        document.getElementById('stdOtpMsg').innerText = data.message;
        document.getElementById('stdOtp').value = data.otp;
      } else {
        err.innerText = data.message;
        err.classList.remove('hidden');
      }
    }

    async function verifyStudentOtp() {
      const otp = document.getElementById('stdOtp').value.trim();
      const res = await fetch('/student/verify-otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ admission_no: tempStudentAdm, otp: otp })
      });
      const data = await res.json();
      if(data.success) {
        activeUser = data.user.name + ` (${tempStudentAdm})`;
        closeModal('studentModal');
        document.getElementById('authSlot').innerHTML = `
          <div class="text-xs bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-xl text-emerald-400 font-bold flex items-center gap-1.5">
            <span>🎓</span> ${data.user.name}
          </div>
        `;
      } else alert(data.message);
    }

    // 3. Visitor Registration
    let tempVisitorMobile = "";
    async function requestVisitorOtp() {
      const name = document.getElementById('visName').value.trim();
      const mobile = document.getElementById('visMobile').value.trim();
      const aadhaar = document.getElementById('visAadhaar').value.trim();
      const purpose = document.getElementById('visPurpose').value;
      const err = document.getElementById('visErr');
      err.classList.add('hidden');

      if (!name || !mobile || !aadhaar) {
        err.innerText = "Saare details daalna anivarya hai.";
        err.classList.remove('hidden');
        return;
      }

      const res = await fetch('/visitor/send-otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name, mobile, aadhaar, purpose })
      });
      const data = await res.json();
      if(data.success) {
        tempVisitorMobile = mobile;
        document.getElementById('visStep1').classList.add('hidden');
        document.getElementById('visStep2').classList.remove('hidden');
        document.getElementById('visOtpNotice').innerText = data.message;
        document.getElementById('visOtp').value = data.otp;
      } else {
        err.innerText = data.message;
        err.classList.remove('hidden');
      }
    }

    async function verifyVisitorOtp() {
      const otp = document.getElementById('visOtp').value.trim();
      const res = await fetch('/visitor/verify-otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ mobile: tempVisitorMobile, otp: otp })
      });
      const data = await res.json();
      if(data.success) {
        closeModal('visitorModal');
        alert(`🎉 Gate Pass Generated: ${data.visitor.pass_id}\nGuest: ${data.visitor.name}`);
        document.getElementById('authSlot').innerHTML = `
          <div class="text-xs bg-purple-950/60 border border-purple-500/40 px-3 py-1.5 rounded-xl text-purple-300 font-bold flex items-center gap-1.5">
            <span>🪪</span> Pass: ${data.visitor.pass_id}
          </div>
        `;
      } else alert(data.message);
    }

    // 4. Grievance
    async function submitGrievance() {
      const desc = document.getElementById('cmpDesc').value.trim();
      const loc = document.getElementById('cmpLoc').value.trim();
      const cat = document.getElementById('cmpCat').value;
      const st = document.getElementById('cmpStatus');

      if (!desc) {
        st.innerText = "Vivaran likhein.";
        st.className = "text-xs text-red-400 block font-bold";
        return;
      }

      const res = await fetch('/submit-complaint', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ description: desc, location: loc, category: cat, admission_no: activeUser || "Guest" })
      });
      const data = await res.json();
      if(data.success) {
        st.innerHTML = `✅ ${data.message} <br><b>Ticket: ${data.ticket_id}</b>`;
        st.className = "text-xs text-emerald-400 block font-bold";
        setTimeout(() => closeModal('complaintModal'), 2000);
      }
    }
  </script>
</body>
</html>
